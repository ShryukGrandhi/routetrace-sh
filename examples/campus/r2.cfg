! Core router with the server LAN and the internet uplink
hostname R2
!
interface GigabitEthernet0/0
 ip address 10.0.12.2 255.255.255.252
!
interface GigabitEthernet0/1
 ip address 10.0.23.1 255.255.255.252
!
interface GigabitEthernet0/2
 description server LAN
 ip address 10.2.0.1 255.255.255.0
 ip access-group SERVERS out
!
interface GigabitEthernet0/3
 description internet uplink
 ip address 203.0.113.2 255.255.255.252
!
ip route 10.1.0.0 255.255.0.0 10.0.12.1
ip route 10.3.0.0 255.255.0.0 10.0.23.2
ip route 10.99.0.0 255.255.0.0 Null0
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/3 203.0.113.1
!
ip access-list extended SERVERS
 10 permit tcp 10.0.0.0 0.255.255.255 host 10.2.0.10 eq www
 20 permit tcp 10.0.0.0 0.255.255.255 host 10.2.0.10 eq 443
 30 permit tcp 10.1.0.0 0.0.0.255 10.2.0.0 0.0.0.255 eq 22
 40 permit tcp any 10.2.0.0 0.0.0.255 established
 50 permit icmp any any
 60 deny ip any any log
!
end
