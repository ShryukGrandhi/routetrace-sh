! Branch A edge router
hostname R1
!
interface GigabitEthernet0/0
 description users LAN A
 ip address 10.1.0.1 255.255.255.0
 ip access-group LAN_A_IN in
!
interface GigabitEthernet0/1
 description to R2 core
 ip address 10.0.12.1 255.255.255.252
!
interface GigabitEthernet0/2
 description to R3 branch B
 ip address 10.0.13.1 255.255.255.252
!
interface GigabitEthernet0/3
 description spare
 ip address 10.1.9.1 255.255.255.0
 shutdown
!
ip route 10.2.0.0 255.255.0.0 10.0.12.2
ip route 10.3.0.0 255.255.0.0 10.0.13.2
! floating static: used only if the R3 link route disappears
ip route 10.3.0.0 255.255.0.0 10.0.12.2 200
ip route 0.0.0.0 0.0.0.0 10.0.12.2
!
ip access-list extended LAN_A_IN
 remark block a known-bad host, allow the rest of the LAN
 10 deny ip host 10.1.0.66 any
 20 permit ip 10.1.0.0 0.0.0.255 any
!
end
